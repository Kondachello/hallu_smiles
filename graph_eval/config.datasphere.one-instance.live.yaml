# Runtime configuration for the bounded DataSphere live probe.
# It contains no secret: the Job injects HALLU_GATEWAY_API_KEY at runtime.
extractor:
  backend: gateway
  model: openai/gemini-2.5-flash
  prompt_profile: grapheval_appendix_a_v1
  output_mode: structured_json
  temperature: 0.0
  max_tokens: 2048
  max_retries: 5
  api_base_env: HALLU_GATEWAY_URL
  api_key_env: HALLU_GATEWAY_API_KEY
  cache_namespace: grapheval/extraction/live-one-instance-v1

nli:
  backend: hhem
  model: /opt/hallu/models/hhem-2.1-open
  revision: 0e7edb3689e710c52ba120086e8f91ea3ee87f23
  model_label: hhem-2.1-open
  device: cpu
  dtype: float32
  batch_size: 8
  evidence_policy: full_context_native
  aggregation: max_unsupported
  paper_threshold: 0.5
  cache_namespace: grapheval/nli/live-one-instance-v1

cache_dir: .cache/graph_eval
cache_only: false
