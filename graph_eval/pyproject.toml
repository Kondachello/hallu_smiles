[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph_eval"
version = "0.1.0"
description = "GraphEval: answer-only KG extraction + per-triple NLI hallucination detection (standalone detector framework)."
readme = "README.md"
requires-python = ">=3.10"
# The core (types, parser, scoring, cache, fake backends) is intentionally
# dependency-free so it runs and unit-tests fully offline on any Python 3.10+.
dependencies = []

[project.optional-dependencies]
# Real backends, added in later stages. Kept optional so the offline core never
# pulls torch/openai and stays testable on machines without them.
gateway = ["openai>=1.30"]
hhem = ["transformers>=4.45,<5", "torch>=2.2"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
graph-eval = "graph_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
