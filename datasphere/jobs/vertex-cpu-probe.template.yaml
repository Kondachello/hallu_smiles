# Render with scripts/render_datasphere_vertex_probe_job.py; do not submit this template directly.
name: hallu-vertex-cpu-probe-__RUN_ID__
desc: Bounded three-QA KGGen compatibility probe through Cloud Run and Vertex AI.
cmd: >-
  bash -lc 'set -Eeuo pipefail;
  export RUN_ROOT="$PWD/vertex-cpu-probe-artifacts/__RUN_ID__";
  mkdir -p "$RUN_ROOT";
  git init source;
  git -C source remote add origin https://github.com/Kondachello/hallu_smiles.git;
  git -C source fetch --depth 1 origin __GIT_COMMIT__;
  git -C source checkout --detach FETCH_HEAD;
  actual_commit="$(git -C source rev-parse HEAD)";
  test "$actual_commit" = "__GIT_COMMIT__";
  export EXPECTED_SOURCE_COMMIT="__GIT_COMMIT__";
  export DATASPHERE_DOCKER_IMAGE_ID="__DOCKER_IMAGE_ID__";
  export DATA_DIR="$DS_PROJECT_HOME/hallu_smiles/shared/ragtruth";
  export HALLU_GATEWAY_URL="__GATEWAY_URL__";
  if ! printenv ARTIFACT_ARCHIVE >/dev/null; then export ARTIFACT_ARCHIVE="$PWD/vertex-cpu-probe-__RUN_ID__.tar.gz"; fi;
  archive_on_exit() {
    status=$?;
    trap - EXIT;
    tar -C "$(dirname "$RUN_ROOT")" -czf "$ARTIFACT_ARCHIVE" "$(basename "$RUN_ROOT")" || true;
    if test -f "$RUN_ROOT/probe.stdout.log"; then echo "[diagnostics] probe stdout tail"; tail -n 320 "$RUN_ROOT/probe.stdout.log" || true; fi;
    if test -f "$RUN_ROOT/probe.stderr.log"; then echo "[diagnostics] probe stderr tail"; tail -n 320 "$RUN_ROOT/probe.stderr.log" || true; fi;
    exit "$status";
  };
  trap archive_on_exit EXIT;
  set +e;
  timeout --signal=TERM --kill-after=60s 3600 bash source/scripts/run_datasphere_vertex_cpu_probe.sh >"$RUN_ROOT/probe.stdout.log" 2>"$RUN_ROOT/probe.stderr.log";
  status=$?;
  set -e;
  exit "$status"'
env:
__DOCKER_ENV_BLOCK__
outputs:
  - vertex-cpu-probe-__RUN_ID__.tar.gz: ARTIFACT_ARCHIVE
flags:
  - attach-project-disk
cloud-instance-types:
  - c1.4
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 60s
