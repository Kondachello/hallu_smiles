# Render with scripts/render_datasphere_job.py; do not submit this template directly.
name: hallu-qa-g1-__RUN_ID__
desc: Strict then support relation-metrics QA pilot on one V100.
cmd: >-
  bash -lc 'set -Eeuo pipefail;
  export RUN_ROOT="$PWD/qa-pilot-artifacts/__RUN_ID__";
  mkdir -p "$RUN_ROOT";
  git init source;
  git -C source remote add origin https://github.com/Kondachello/hallu_smiles.git;
  git -C source fetch --depth 1 origin __GIT_COMMIT__;
  git -C source checkout --detach FETCH_HEAD;
  actual_commit="$(git -C source rev-parse HEAD)";
  test "$actual_commit" = "__GIT_COMMIT__";
  export MODEL_ID="__MODEL_ID__";
  export MODEL_PATH="$(python source/scripts/resolve_datasphere_shared_model.py --shared-root "$DS_PROJECT_HOME/hallu_smiles/shared" --model-id "$MODEL_ID")";
  export DATA_DIR="$DS_PROJECT_HOME/hallu_smiles/shared/ragtruth";
  export MODEL_DTYPE=half;
  export MODEL_MAX_MODEL_LEN=8192;
  export DATASPHERE_UNITS_PER_SECOND=72;
  export GPU_TIME_LIMIT_SECONDS=10800;
  if ! printenv ARTIFACT_ARCHIVE >/dev/null; then export ARTIFACT_ARCHIVE="$PWD/qa-pilot-__RUN_ID__.tar.gz"; fi;
  archive_on_exit() {
    status=$?;
    trap - EXIT;
    tar -C "$(dirname "$RUN_ROOT")" -czf "$ARTIFACT_ARCHIVE" "$(basename "$RUN_ROOT")" || true;
    if test -f "$RUN_ROOT/pilot.stdout.log"; then echo "[diagnostics] pilot stdout tail follows"; tail -n 320 "$RUN_ROOT/pilot.stdout.log" || true; fi;
    if test -f "$RUN_ROOT/pilot.stderr.log"; then echo "[diagnostics] pilot stderr tail follows"; tail -n 320 "$RUN_ROOT/pilot.stderr.log" || true; fi;
    if test -f "$RUN_ROOT/vllm.log"; then echo "[diagnostics] vLLM log tail follows"; tail -n 240 "$RUN_ROOT/vllm.log" || true; fi;
    if test -f "$RUN_ROOT/gpu.csv"; then echo "[diagnostics] GPU samples tail follows"; tail -n 80 "$RUN_ROOT/gpu.csv" || true; fi;
    exit "$status";
  };
  on_signal() { exit 143; };
  trap archive_on_exit EXIT;
  trap on_signal INT TERM;
  set +e;
  timeout --signal=TERM --kill-after=60s 10800 bash source/scripts/run_datasphere_qa_pilot.sh >"$RUN_ROOT/pilot.stdout.log" 2>"$RUN_ROOT/pilot.stderr.log";
  job_status=$?;
  set -e;
  exit "$job_status"'
env:
  python:
    type: manual
    version: "3.11"
    requirements-file: requirements.datasphere.txt
    # The CLI requires an explicit local source path for shell entrypoints.
    # The Job itself still clones and verifies the pinned public Git commit.
    local-paths:
      - scripts
outputs:
  - qa-pilot-__RUN_ID__.tar.gz: ARTIFACT_ARCHIVE
flags:
  - attach-project-disk
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 60s
