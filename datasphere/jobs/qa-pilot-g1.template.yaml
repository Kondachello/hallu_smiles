# Render with scripts/render_datasphere_job.py; do not submit this template directly.
name: hallu-qa-g1-__RUN_ID__
desc: Strict then support relation-metrics QA pilot on one V100.
cmd: >
  set -Eeuo pipefail;
  export RUN_ROOT="${PWD}/qa-pilot-artifacts/__RUN_ID__";
  mkdir -p "$RUN_ROOT";
  git init source;
  git -C source remote add origin https://github.com/Kondachello/hallu_smiles.git;
  git -C source fetch --depth 1 origin __GIT_COMMIT__;
  git -C source checkout --detach FETCH_HEAD;
  actual_commit="$(git -C source rev-parse HEAD)";
  test "$actual_commit" = "__GIT_COMMIT__";
  export MODEL_ID="meta-llama/Meta-Llama-3.1-8B-Instruct";
  export MODEL_PATH="$(python source/scripts/resolve_datasphere_shared_model.py
    --shared-root "${DS_PROJECT_HOME}/hallu_smiles/shared" --model-id "$MODEL_ID")";
  export DATA_DIR="${DS_PROJECT_HOME}/hallu_smiles/shared/ragtruth";
  export VLLM_DTYPE=half;
  export VLLM_MAX_MODEL_LEN=8192;
  export DATASPHERE_UNITS_PER_SECOND=72;
  export GPU_TIME_LIMIT_SECONDS=10800;
  set +e;
  timeout --signal=TERM --kill-after=60s 10800 bash source/scripts/run_datasphere_qa_pilot.sh;
  job_status=$?;
  set -e;
  tar -C "$(dirname "$RUN_ROOT")" -czf "${ARTIFACT_ARCHIVE}" "$(basename "$RUN_ROOT")";
  exit "$job_status"
env:
  python:
    type: manual
    version: "3.11"
    requirements-file: requirements.datasphere.txt
outputs:
  - qa-pilot-__RUN_ID__.tar.gz: ARTIFACT_ARCHIVE
flags:
  - attach-project-disk
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 60s
