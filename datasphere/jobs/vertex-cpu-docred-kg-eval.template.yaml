# Render with scripts/render_datasphere_vertex_docred_kg_eval_job.py; do not submit this template directly.
name: hallu-vertex-cpu-docred-kg-__RUN_ID__
desc: Deterministic, budget-capped DocRED KGGen extraction evaluation through Cloud Run and Vertex AI.
# There is intentionally no arbitrary in-container time limit. The runner has
# request-level retry deadlines and durable project-disk caches; completed
# documents must remain resumable after a platform interruption.
cmd: >-
  bash -lc 'set -Eeuo pipefail;
  export RUN_ROOT="$PWD/vertex-cpu-docred-kg-artifacts/__RUN_ID__";
  mkdir -p "$RUN_ROOT";
  git init source;
  git -C source remote add origin https://github.com/Kondachello/hallu_smiles.git;
  git -C source fetch --depth 1 origin __GIT_COMMIT__;
  git -C source checkout --detach FETCH_HEAD;
  actual_commit="$(git -C source rev-parse HEAD)";
  test "$actual_commit" = "__GIT_COMMIT__";
  export EXPECTED_SOURCE_COMMIT="__GIT_COMMIT__";
  export DATASPHERE_DOCKER_IMAGE_ID="__DOCKER_IMAGE_ID__";
  export EXPECTED_GATEWAY_MANIFEST_SHA256="__GATEWAY_MANIFEST_SHA256__";
  export HALLU_GATEWAY_URL="__GATEWAY_URL__";
  export DOCRED_BUDGET_EUR="__DOCRED_BUDGET_EUR__";
  export ARCHIVE_PATH="${ARTIFACT_ARCHIVE}";
  printf "[artifact] output=%s\\n" "$ARCHIVE_PATH";
  archive_ready=0;
  archive_artifacts() {
    if test "$archive_ready" = 1; then return 0; fi;
    # Cache keys and raw KG completion material are intentionally kept only on
    # project disk. The terminal archive contains redacted progress, aggregate
    # usage, provenance, metrics, and diagnostics needed to verify the result.
    tar -C "$(dirname "$RUN_ROOT")" \
      --exclude="*/docred-live/graphs" --exclude="*/docred-live/graphs/*" \
      --exclude="*/docred-replay/graphs" --exclude="*/docred-replay/graphs/*" \
      --exclude="*/usage.jsonl" \
      -czf "$ARCHIVE_PATH" "$(basename "$RUN_ROOT")";
    tar -tzf "$ARCHIVE_PATH" >/dev/null;
    test -s "$ARCHIVE_PATH";
    chmod a+r "$ARCHIVE_PATH";
    archive_ready=1;
  };
  archive_on_exit() {
    status=$?;
    trap - EXIT;
    if ! archive_artifacts; then
      echo "failed to create a readable DocRED experiment artifact" >&2;
      if test "$status" -eq 0; then status=1; fi;
    fi;
    if test -f "$RUN_ROOT/docred.stdout.log"; then echo "[diagnostics] DocRED stdout tail"; tail -n 320 "$RUN_ROOT/docred.stdout.log" || true; fi;
    if test -f "$RUN_ROOT/docred.stderr.log"; then echo "[diagnostics] DocRED stderr tail"; tail -n 320 "$RUN_ROOT/docred.stderr.log" || true; fi;
    exit "$status";
  };
  trap archive_on_exit EXIT;
  set +e;
  bash source/scripts/run_datasphere_vertex_cpu_docred_kg_eval.sh > >(tee "$RUN_ROOT/docred.stdout.log") 2> >(tee "$RUN_ROOT/docred.stderr.log" >&2);
  status=$?;
  set -e;
  if ! archive_artifacts; then status=1; fi;
  exit "$status"'
env:
__DOCKER_ENV_BLOCK__
outputs:
  - vertex-cpu-docred-kg-__RUN_ID__.tar.gz: ARTIFACT_ARCHIVE
flags:
  - attach-project-disk
cloud-instance-types:
  - c1.4
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 60s
